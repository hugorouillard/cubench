[project]
name = "cube-timer-api"
version = "0.1.0"
description = "Local API for the Cube Timer MVP"
authors = [
    { name = "hugo rouillard", email = "rouillard.hugo1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
